services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: midnight-proof-server
    command: ["midnight-proof-server", "-v"]
    ports:
      # MUST bind to loopback only: proof requests carry private witness data
      - "127.0.0.1:6300:6300"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6300/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
